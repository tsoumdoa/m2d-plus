<style>
#worker-times{font-family:var(--font-sans);color:var(--foreground)}
#worker-times .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#worker-times select{font:inherit;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px}
#worker-times .legend{display:flex;gap:16px;color:var(--muted-foreground);margin-top:8px}
#worker-times .swatch{display:inline-block;width:12px;height:12px;margin-right:6px}
#worker-times svg{display:block;width:100%;height:310px;overflow:visible}
#worker-times text{fill:var(--foreground);font:13px var(--font-sans)}
#worker-times .note{color:var(--muted-foreground);font-size:12px;margin-top:10px}
</style>
<div id="worker-times">
<div class="controls"><strong>Eight-view solve wall time</strong><label>Scene <select aria-label="Scene"><option value="M">M · 5,000 sources</option><option value="L">L · 20,000 sources</option></select></label></div>
<svg viewBox="0 0 700 310" role="img" aria-label="Solve wall time by worker count"></svg>
<div class="legend"><span><i class="swatch" style="background:var(--chart-1)"></i>Cold</span><span><i class="swatch" style="background:var(--chart-2)"></i>Warm</span><span><i class="swatch" style="background:var(--muted-foreground)"></i>In process</span></div>
<div class="note">Seconds; lower is faster. Fresh-process cold includes startup and scene transfer. n=1; other agents' Rhino jobs were active.</div>
</div>
<script>
(()=>{
const rows=__ROWS__;
const root=document.getElementById('worker-times'), select=root.querySelector('select'), svg=root.querySelector('svg');
function draw(){
 const scene=select.value, data=rows.filter(r=>r.scene===scene), max=Math.ceil(Math.max(...data.map(r=>r.cold_seconds))/25)*25;
 const x=v=>130+v/max*480;let content='';
 for(let i=0;i<=4;i++){const v=max*i/4, p=x(v);content+=`<line x1="${p}" x2="${p}" y1="4" y2="274" stroke="var(--border)"/><text x="${p}" y="299" text-anchor="middle">${v.toFixed(0)} s</text>`;}
 data.forEach((r,i)=>{
  const y=17+i*65, local=r.route==='local', name=local?'In process':r.route+' worker'+(r.route==='1'?'':'s');
  content+=`<text x="118" y="${y+21}" text-anchor="end">${name}</text>`;
  const bars=local?[[r.cold_seconds,'var(--muted-foreground)',10]]:[[r.cold_seconds,'var(--chart-1)',0],[r.warm_seconds,'var(--chart-2)',25]];
  bars.forEach(([v,color,dy])=>{content+=`<rect x="130" y="${y+dy}" width="${x(v)-130}" height="19" rx="2" fill="${color}"/><text x="${x(v)+7}" y="${y+dy+14}">${v.toFixed(1)}</text>`;});
 });svg.innerHTML=content;
}
select.addEventListener('change',draw);draw();
})();
</script>
