const PIPES = [];

  const xb = (j + .5) * PL;
  for (const s of [-1, 1]) for (const i of [j, j + 1]) pipe([xb, s * WD / 2, 0], [i * PL, 0, HT], .04, 'brace');

const camTitle = fitCam('title', 950, 540, 800);

// ------------------------------------------------------------------ exact hidden-line classification (for view FWD0)
const WRAY = mul(FWD0, -1);
function rayInterval(p, w, c) {          // parameter range of p + s*w inside the solid cylinder c
